"$schema" = 'https://starship.rs/config-schema.json'

# Pure-inspired shape with Gruvbox colors and icons.
# Foreground colors only: no powerline backgrounds, so long prompts can soft-wrap
# without background-color bleed.
format = """
$directory\
$git_branch\
$git_status\
$python\
$docker_context\
$cmd_duration\
$line_break\
${custom.python_venv}\
$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

[directory]
style = "bold fg:color_blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "fg:color_aqua"
format = '[$symbol$branch]($style) '

[git_status]
style = "fg:color_red"
format = '([$all_status$ahead_behind]($style) )'

[python]
symbol = " "
style = "fg:color_yellow"
format = '[$symbol$version]($style) '

[custom.python_venv]
when = 'test -n "$VIRTUAL_ENV"'
command = 'basename "$VIRTUAL_ENV"'
symbol = " "
style = "fg:color_yellow"
format = '[$symbol$output]($style) '

[docker_context]
symbol = " "
style = "fg:color_blue"
format = '[$symbol$context]($style) '

[cmd_duration]
min_time = 2_000
style = "fg:color_bg3"
format = '[took $duration]($style) '

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
