# Nord overrides for config.yml. With `just theme nord`, Zsh sets
# LG_CONFIG_FILE to config.yml,nord.yml; later files override earlier ones.
# See NORD.md.
gui:
  authorColors:
    "*": "#8fbcbb"

  theme:
    activeBorderColor:
      - "#88c0d0"
      - bold
    inactiveBorderColor:
      - "#4c566a"
    searchingActiveBorderColor:
      - "#ebcb8b"
      - bold
    optionsTextColor:
      - "#81a1c1"
    selectedLineBgColor:
      - "#434c5e"
    inactiveViewSelectedLineBgColor:
      - "#3b4252"
    cherryPickedCommitFgColor:
      - "#88c0d0"
    cherryPickedCommitBgColor:
      - "#4c566a"
    markedBaseCommitFgColor:
      - "#2e3440"
    markedBaseCommitBgColor:
      - "#ebcb8b"
    unstagedChangesColor:
      - "#bf616a"
    defaultFgColor:
      - "#d8dee9"
