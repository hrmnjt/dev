# Run the portable repository checks on pull requests and on main. Host checks
# need the Mac, so CI runs `doctor --only-check` and the Stow regression only.
name: doctor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  only-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Repository checks
        run: just doctor --only-check --verbose
      - name: Stow diagnostic regression
        run: sh ./_scripts/tests/doctor-stow.sh
