# Run the portable repository checks on every push and pull request. Host checks
# need the Mac, so CI runs `doctor --only-check` only.
name: doctor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  only-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Repository checks
        run: just doctor --only-check --verbose
