onboarding = false

[theme]
name = "gruvbox"

[keys]
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+d"

# ChmaraX/herdr-nvim plugin actions. Install the plugin first:
#   herdr plugin install ChmaraX/herdr-nvim
# herdr binds no plugin actions by default; these mirror the README.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[ui]
prompt_new_tab_name = true
pane_scrollbars = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

# Ghostty/macOS owns the desktop-notification sound. Disable Herdr's separate
# semantic sound to avoid hearing both for the same agent state change.
[ui.sound]
enabled = false

[experimental]
kitty_graphics = true
